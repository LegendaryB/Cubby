name: Release

# Pushing a version tag (e.g. v1.0.1) builds the addon zip and publishes a GitHub release.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history and tags for the release notes

      - name: Check version in Cubby.toc
        run: |
          toc_version=$(sed -n 's/^## Version: *//p' Cubby/Cubby.toc | tr -d '\r')
          if [ "${GITHUB_REF_NAME#v}" != "$toc_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match '## Version: $toc_version' in Cubby/Cubby.toc"
            exit 1
          fi

      - name: Build package
        run: zip -r "Cubby-$GITHUB_REF_NAME.zip" Cubby

      - name: Write release notes
        run: |
          previous=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          git log --pretty='- %s' "${previous:+$previous..}$GITHUB_REF_NAME" > notes.md
          cat notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "Cubby-$GITHUB_REF_NAME.zip" \
            --title "Cubby $GITHUB_REF_NAME" \
            --notes-file notes.md
